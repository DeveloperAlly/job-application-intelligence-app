# Walkthrough step 6. Tasks for Career OS.
#
# Every `done` extracts the acceptance command from pm/03-requirements.md and runs it.
# It never copies that command. The register is the only home for any criterion, so the
# task file cannot drift from it. The extraction pattern was run against R-117, R-123,
# R-127 and R-143 before this file was written; all four extracted and executed.
#
# Tier 1 starting state, 2026-09-09: 18 of 18 acceptance commands red, 0 green,
# 0 unextractable. That is the ladder these tasks climb.
#
# WIP cap: 3. Not inherited. Three is how many done-commands can be re-run and read
# inside one turn without deferring verification, and deferred verification is the
# failure this project is correcting. Raise it only by arguing with that reasoning.
#
# On the word "and" in an outcome. Step 6 says an outcome containing "and" should be
# split. Four outcomes contain it. Two are list conjunctions rather than two outcomes:
# T-011 renders two document kinds through one renderer, T-015 records three fields in
# one ledger entry. Two are genuine conjunctions kept as one task under rule 7, because
# they always ship together and share an owns set: T-001, where the record shape and the
# self-provenance rule are both the evidence store's contract, and T-012, where approval,
# claim display and override recording are one surface. Splitting either would put two
# tasks in one directory, which is the failure the disjointness rule exists to prevent.

- id: T-001
  outcome: an evidence record carries a source, a date, and never cites a document this system generated
  requirement: [R-117, R-140]
  depends_on: []
  owns:
    - src/evidence/**
    - tests/evidence/**
  done: |-
    python3 -c "import re,subprocess,sys;ids='R-117 R-140'.split();L=open('pm/03-requirements.md').readlines();f=lambda r:re.search(chr(96)+'(.+?)'+chr(96),[x for x in L if x.startswith('| '+r+' ')][0].replace(chr(92)+chr(124),chr(0)).split(chr(124))[4].strip().replace(chr(0),chr(124)),re.S).group(1);sys.exit(max(subprocess.run(['bash','-c',f(r)]).returncode for r in ids))"
  evidence:
    - src/evidence/store.py
    - tests/evidence/test_source_and_date.py
    - tests/evidence/test_rejects_self_generated_provenance.py
  status: done
  note: >-
    Done command green, verified by the PM 2026-09-09. R-117 prints 27 of 27 records carrying a
    source and a date. R-140 exits 0 but is VACUOUS on real data, denominator 0, because no
    generated document exists yet for a claim to rest on. Re-run R-140 when T-011 renders the
    first document; do not treat it as green before then. 27 of 73 available facts imported,
    46 rejected and listed rather than invented.

